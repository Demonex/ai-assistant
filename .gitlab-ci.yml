stages:
  - build
  - deploy

variables:
  VERSION: 0.1.0-$CI_COMMIT_SHORT_SHA-snapshot

build:
  stage: build
  parallel:
    matrix:
      - APP_TYPE: [backend, admin, web]
  variables:
    IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/$APP_TYPE
    IMAGE_TAG: $VERSION
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - git submodule update --init --recursive --remote
    - docker build -t $IMAGE:$VERSION . -f docker/Dockerfile.$APP_TYPE 
    - docker push $IMAGE:$VERSION
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


deploy:
  stage: deploy
  image: docker-group.sigma-it.ru/kroniak/ssh-client
  before_script:
    - echo $SSH_PRIVATE_KEY > sigmachat_id_rsa
  script:
    - ssh -o StrictHostKeychecking=no -i sigmachat_id_rsa user@dpis-scd1.sigma-it.local 'cd demo-stand-deploy && export NEW_APP_VERSION=$VERSION && sed -i  "s/^\(.*APP_VERSION=\).*/\1${NEW_APP_VERSION}/" .env && docker compose up -d'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $AUTODEPLOY_DEMO == "true"
  needs:
    - build