#map $http_origin $allow_origin {
#    ~^https://(stage|mm\.)?ray.sx $http_origin;
#}

server {
    listen 80 default;
    server_name _;
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name stage.rifify.ru;
    keepalive_timeout	70;
    keepalive_requests	150;
    root /var/www/frontend/public;
    location / {
    #  add_header 'Cache-Control' 'public, max-age=360, s-maxage=2678400';
      try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name rifify.ru;
    keepalive_timeout	70;
    keepalive_requests	150;
    root /var/www/coming-soon/public;
    location / {
    #  add_header 'Cache-Control' 'public, max-age=360, s-maxage=2678400';
      try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name backend.rifify.ru;
    keepalive_timeout	70;
    keepalive_requests	150;
    location / {
        include /etc/nginx/options.request.conf;
        include /etc/nginx/proxy.settings.conf;
        proxy_pass http://backend:2050;
    }
    location /socket.io {
        include /etc/nginx/options.request.conf;
        include /etc/nginx/proxy.settings.conf;
        proxy_read_timeout 86400;
        proxy_redirect off;
        proxy_pass http://backend:8081;
    }
}
